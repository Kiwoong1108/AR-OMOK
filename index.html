<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>증강 오목</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Serif+KR:wght@700;900&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 장난스러운 대국장 — 바둑판은 진지한데 벌어지는 일은 어이없다
   IDEA: 비자나무 오목판 + 한자 한 글자가 새겨진 증강 패
   PICTURE: 캔버스 오목판이 화면 중심, 양옆에 흑/백 패 보관함
   COLOUR and TYPE: 짙은 먹색 배경, 나무판 주황, 실버·골드·프리즘 등급색 / Black Han Sans + Noto Serif KR 한자
   LAYOUT: 흑 패널 | 판 | 백 패널, 600px 이하에선 판 위로 패널 두 개 나란히 */
:root{color-scheme:dark;--bg:#16120f;--panel:#241d18;--line:#3d3129;--ink:#f2e8da;--mut:#a3937f;--acc:#f0b54a}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:radial-gradient(ellipse at 50% -10%,#3b2a1c 0,#16120f 60%) fixed;color:var(--ink);font:15px/1.5 "Noto Sans KR",system-ui,sans-serif;min-height:100vh;overflow-x:clip}
header{max-width:1180px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;padding:14px 16px 6px;gap:10px}
h1{margin:0;font:400 clamp(26px,4vw,38px)/1 "Black Han Sans",sans-serif;letter-spacing:1px}
h1 b{font-weight:400;color:var(--acc)}
.btn{background:#33291f;color:var(--ink);border:1px solid #57473a;border-radius:10px;padding:10px 16px;font:500 15px "Noto Sans KR",sans-serif;cursor:pointer;min-height:44px}
.btn:hover{background:#43362a}.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn:disabled{opacity:.4;cursor:default}
#status{max-width:1180px;margin:0 auto;padding:2px 16px 10px;font-weight:500;min-height:30px;color:var(--mut)}
#status em{font-style:normal;color:var(--acc)}
main{max-width:1180px;margin:0 auto;padding:0 12px 24px;display:grid;grid-template-columns:230px minmax(0,auto) 230px;gap:16px;justify-content:center;align-items:start}
.pl{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:12px;transition:border-color .2s,box-shadow .2s}
.pl.on{border-color:var(--acc);box-shadow:0 0 24px #f0b54a40}
.pl h2{margin:0 0 8px;font:400 20px "Black Han Sans",sans-serif;display:flex;align-items:center;gap:8px}
.st{width:20px;height:20px;border-radius:50%;flex:none}
.st.k{background:radial-gradient(circle at 35% 30%,#777,#050505 70%)}
.st.w{background:radial-gradient(circle at 35% 30%,#fff,#c9c4bb 75%)}
.badges{display:flex;flex-wrap:wrap;gap:5px;min-height:24px;margin-bottom:8px}
.bd{font-size:12px;padding:2px 8px;border-radius:999px;background:#3a2f25;color:var(--ink);white-space:nowrap}
.hand{display:flex;flex-direction:column;gap:6px}
.empty{color:var(--mut);font-size:13px;padding:6px 2px}
.hc{display:flex;gap:10px;align-items:center;text-align:left;width:100%;background:#2f261f;border:1px solid #4a3c30;border-radius:12px;padding:8px 10px;color:var(--ink);cursor:pointer;font:inherit;min-height:48px}
.hc:hover:not(:disabled){background:#3b3027}.hc:disabled{opacity:.45;cursor:default}
.hc.sel{border-color:var(--acc);background:#45371f}
.hj{font:900 22px "Noto Serif KR",serif;width:34px;height:34px;border-radius:8px;display:grid;place-items:center;flex:none;color:#1a140f}
.t0 .hj,.hj.t0{background:linear-gradient(145deg,#eef2f6,#9aa4b0)}
.t1 .hj,.hj.t1{background:linear-gradient(145deg,#ffe49a,#d29a26)}
.t2 .hj,.hj.t2{background:linear-gradient(120deg,#ff9bd2,#9ad8ff,#c3ff9b,#ffd59b);background-size:300% 300%;animation:pr 3s linear infinite}
@keyframes pr{to{background-position:300% 0}}
.hc small{display:block;color:var(--mut);font-size:12px;line-height:1.35}
.boardbox{position:relative;border-radius:14px;box-shadow:0 18px 50px #000a,0 0 0 1px #00000060}
canvas{display:block;border-radius:14px;touch-action:none;cursor:pointer}
#chatHome{width:100%}#chatHome #msgs{height:170px}
#chat{background:#1e1814;border:1px solid var(--line);border-radius:12px;padding:8px;text-align:left}
#msgs{height:112px;overflow:auto;font-size:14px;padding:2px 4px 6px;display:flex;flex-direction:column;gap:2px}
#msgs div{overflow-wrap:anywhere}#msgs b{color:var(--acc);margin-right:6px;font-weight:700}#msgs .me b{color:#9ad8ff}#msgs .sys{color:var(--mut);font-size:13px}
#msgs:empty::before{content:'채팅을 보내 보세요';color:var(--mut);font-size:13px}
#cf{display:flex;gap:6px}#cf input{flex:1;min-width:0;background:#16110d;color:var(--ink);border:1px solid #57473a;border-radius:10px;padding:10px;font:16px "Noto Sans KR",sans-serif;min-height:44px}#cf input:focus-visible{outline:2px solid var(--acc)}
#lobby{overflow:auto;background:#0b0806a8;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.prow{display:flex;align-items:center;gap:10px;background:#2f261f;border:1px solid #4a3c30;border-radius:12px;padding:10px 12px;text-align:left;min-height:48px}
.prow span{flex:1;font-weight:700}.prow small{color:var(--mut)}.prow.wait{border-style:dashed;opacity:.6}.prow.wait span{font-weight:400;animation:bl 1.4s ease-in-out infinite}
@keyframes bl{50%{opacity:.4}}
#plist{display:flex;flex-direction:column;gap:8px;margin:12px 0}
#chatSlot{margin-bottom:10px}#chatSlot #msgs{height:120px}
.ov{position:fixed;inset:0;background:#0b0806cc;display:grid;place-items:center;z-index:5;padding:16px;backdrop-filter:blur(3px)}
.ov.hide{display:none}
.pick{max-width:760px;width:100%;text-align:center}
.pick h3{margin:0 0 4px;font:400 clamp(24px,4vw,34px) "Black Han Sans",sans-serif}
.pick p{margin:0 0 16px;color:var(--mut)}
.pc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:14px}
.card{background:#2a211b;border:2px solid #5a4a3c;border-radius:18px;padding:18px 12px 16px;cursor:pointer;color:var(--ink);font:inherit;display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform .15s;animation:pop .35s backwards}
.card:nth-child(2){animation-delay:.08s}.card:nth-child(3){animation-delay:.16s}
@keyframes pop{from{transform:translateY(24px) scale(.9);opacity:0}}
.card:hover{transform:translateY(-6px)}.card:focus-visible{outline:3px solid var(--acc)}
.card.t0{border-color:#aab3bd}.card.t1{border-color:#e6b13d;box-shadow:0 0 24px #e6b13d33}.card.t2{border-color:#e7a6ff;box-shadow:0 0 30px #b98cff55}
.card .hj{width:64px;height:64px;font-size:38px;border-radius:14px}
.card b{font:400 21px "Black Han Sans",sans-serif}
.card span{font-size:14px;color:#d8cbb9;line-height:1.4}
.tier{font-size:12px;color:var(--mut)}
.win h3{font-size:clamp(34px,7vw,56px)}
.hide{display:none!important}
.lob{max-width:460px;background:#221b16;border:1px solid var(--line);border-radius:22px;padding:28px 22px;box-shadow:0 30px 80px #000c}
.lob h3{font-size:clamp(40px,8vw,56px);margin-bottom:2px}.lob h3 b{font-weight:400;color:var(--acc)}
.lcol{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.big{font-size:17px;padding:14px;min-height:52px;border-radius:14px}
.prim{background:var(--acc);color:#2a1a08;border-color:#ffd27a;font-weight:700}.prim:hover{background:#ffc867}
.jrow{display:flex;gap:8px}
.jrow input{flex:1;min-width:0;font:700 22px "Noto Sans KR",sans-serif;letter-spacing:6px;text-align:center;text-transform:uppercase;background:#16110d;color:var(--ink);border:1px solid #57473a;border-radius:14px;padding:10px;min-height:52px}
.jrow input:focus-visible{outline:2px solid var(--acc)}
.ghost{background:none;border-color:transparent;color:var(--mut);text-decoration:underline;text-underline-offset:3px}
#wcode{font:400 clamp(56px,14vw,84px)/1 "Black Han Sans",sans-serif;letter-spacing:10px;color:var(--acc);margin:6px 0 10px}
#lmsg{min-height:22px;margin:14px 0 0;color:var(--mut);font-size:14px}
.hbtns{display:flex;gap:8px}
.dg{display:flex;gap:8px;align-items:baseline;text-align:left;font-size:14px;padding:6px 2px;border-bottom:1px solid #3a2f26}.dg b{flex:none;width:44px;font-size:13px}.dg .ok{color:#8fe08f}.dg .no{color:#ff8a7a}.dg .wt{color:var(--mut)}
.dgc{margin-top:10px;text-align:left;font-size:14px;line-height:1.5;background:#2f261f;border-radius:12px;padding:10px 12px}
.mkrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.pubh{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-weight:700}.pubh .btn{min-height:36px;padding:4px 8px}
#publist{display:flex;flex-direction:column;gap:6px;max-height:210px;overflow:auto}
.pubroom{width:100%;cursor:pointer;color:var(--ink);font:inherit}.pubroom:hover{border-color:var(--acc)}.pubroom b{color:var(--acc);font:400 18px "Black Han Sans",sans-serif;min-width:34px;text-align:left}
.pubroom .go{font-style:normal;background:var(--acc);color:#2a1a08;border-radius:8px;padding:4px 10px;font-weight:700;font-size:13px}.pubroom .go.w{background:#4a3c30;color:var(--ink)}
.pempty{color:var(--mut);font-size:14px;padding:10px;border:1px dashed #4a3c30;border-radius:12px}
.gotw{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.goth{font-size:12px;color:var(--mut);margin-bottom:6px}
.got{display:flex;flex-wrap:wrap;gap:5px}
.gc{display:inline-flex;align-items:center;gap:5px;background:#2f261f;border:1px solid #4a3c30;border-radius:999px;padding:2px 9px 2px 3px;color:var(--ink);font:500 12px "Noto Sans KR",sans-serif;cursor:pointer;min-height:28px}
.gc .hj{width:22px;height:22px;font-size:13px;border-radius:50%}
.gc.on{border-color:var(--acc)}.gc:focus-visible{outline:2px solid var(--acc)}
.gc.t1{border-color:#8a6a24}.gc.t2{border-color:#8a5fa8}
.gd{font-size:12px;color:#d8cbb9;line-height:1.4;margin-top:6px;min-height:0}
.got:empty::before{content:'아직 없음';color:var(--mut);font-size:12px}
.eye{font:700 12px "Noto Sans KR",sans-serif;font-style:normal;background:#443629;border-radius:6px;padding:3px 6px;color:var(--acc)}.prow.spec{border-style:dotted}
/* 넓은 화면: 흑 | 판 | 백+채팅, 한 화면에 다 들어오게 */
main{grid-template-rows:auto minmax(0,1fr)}#p1{grid-column:1;grid-row:1/span 2}#p2{grid-column:3;grid-row:1}.boardbox{grid-column:2;grid-row:1/span 2}#chatHome{grid-column:3;grid-row:2;align-self:start}
.pl{position:relative}
.bub{position:absolute;left:10px;right:10px;top:46px;z-index:3;background:#fff8ea;color:#2a1a08;border-radius:12px;padding:7px 11px;font:500 14px/1.35 "Noto Sans KR",sans-serif;box-shadow:0 8px 20px #0009;opacity:0;transform:translateY(-6px) scale(.96);transition:opacity .18s,transform .18s;pointer-events:none;overflow-wrap:anywhere}
.bub::before{content:'';position:absolute;top:-7px;left:20px;border:7px solid transparent;border-top:0;border-bottom-color:#fff8ea}
.bub.show{opacity:1;transform:none}
@media(max-width:1000px){main{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:none}#p1,#p2{grid-row:1}#p2{grid-column:2}.boardbox{grid-column:1/-1;justify-self:center;grid-row:2}#chatHome{grid-column:1/-1;grid-row:3}#chatHome #msgs{height:48px}}
@media(max-width:600px){.pc{grid-template-columns:minmax(0,1fr)}.card{flex-direction:row;text-align:left;padding:12px}.card .hj{width:52px;height:52px;font-size:30px}.card div{display:flex;flex-direction:column}.pl{padding:10px}.hc small{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<header><h1>증강 <b>오목</b></h1><div class="hbtns"><button class="btn" id="restart">새 판</button><span class="bd hide" id="specs" style="align-self:center"></span><button class="btn hide" id="leave">나가기</button></div></header>
<div id="status"></div>
<main>
  <section class="pl" id="p1"><div class="bub" id="bub1"></div><h2><i class="st k"></i><span id="n1">흑</span></h2><div class="badges" id="bd1"></div><div class="hand" id="h1"></div><div class="gotw"><div class="goth">먹은 증강</div><div class="got" id="g1"></div><div class="gd" id="gd1"></div></div></section>
  <div class="boardbox"><canvas id="cv"></canvas></div>
  <section class="pl" id="p2"><div class="bub" id="bub2"></div><h2><i class="st w"></i><span id="n2">백</span></h2><div class="badges" id="bd2"></div><div class="hand" id="h2"></div><div class="gotw"><div class="goth">먹은 증강</div><div class="got" id="g2"></div><div class="gd" id="gd2"></div></div></section>
  <div id="chatHome" class="hide"><div id="chat"><div id="msgs"></div><form id="cf"><input id="ci" maxlength="120" placeholder="메시지 입력" autocomplete="off" aria-label="채팅"><button class="btn">전송</button></form></div></div>
</main>
<div class="ov hide" id="ov"><div class="pick"><h3 id="pt"></h3><p id="pp"></p><div class="pc" id="pc"></div><button class="btn" id="rr"></button></div></div>
<div class="ov hide win" id="wo"><div class="pick"><h3 id="wt"></h3><p id="wp"></p><button class="btn" id="again">한 판 더</button></div></div>
<div class="ov hide" id="gone"><div class="pick lob"><h3 id="lt" style="font-size:32px"></h3><p>방이 닫혔어요</p><button class="btn big prim" id="gback">처음으로</button></div></div>
<div class="ov" id="lobby"><div class="pick lob">
  <h3>증강 <b>오목</b></h3><p>친구에게 방 코드를 알려주고 한 판</p>
  <div class="lcol" id="lchoose">
    <div class="jrow"><input id="nick" maxlength="10" placeholder="닉네임" autocomplete="off" aria-label="닉네임" style="letter-spacing:0;font-size:18px"></div>
    <div class="mkrow"><button class="btn big prim" id="mkpub">공개방 만들기</button><button class="btn big" id="mk">비공개방 만들기</button></div>
    <div class="jrow"><input id="code" maxlength="4" placeholder="코드" autocomplete="off" aria-label="방 코드"><button class="btn big" id="jn">입장</button></div>
    <div class="pubh"><span>공개방</span><button class="btn ghost" id="pubr">새로고침</button></div>
    <div id="publist"></div>
    <button class="btn ghost" id="solo">한 기기에서 둘이 하기</button>
    <button class="btn ghost" id="diagb">연결이 안 되나요? 연결 진단</button>
    <div class="hide" id="diag"></div>
  </div>
  <div class="hide" id="room"><p style="margin:0" id="wlab">방 코드</p><div id="wcode"></div><button class="btn" id="copy">코드 복사</button>
    <div id="plist"></div><div id="chatSlot"></div>
    <div class="lcol"><button class="btn big prim" id="startb" disabled>게임 시작</button><button class="btn ghost" id="wback">나가기</button></div></div>
  <p id="lmsg"></p>
</div></div>
<script>
{
const N=15,NAME={1:'흑',2:'백'},TIER=['실버','골드','프리즘'];
const AUG={
 eraser:{n:'지우개',j:'消',t:0,d:'상대 돌 1개를 지운다',k:'target'},
 wall:{n:'철벽',j:'壁',t:0,d:'빈 칸에 아무도 못 쓰는 벽을 세운다',k:'target'},
 shot:{n:'산탄',j:'散',t:0,d:'빈 칸 아무 데나 내 돌 2개가 떨어진다',k:'instant'},
 mine:{n:'지뢰',j:'雷',t:0,d:'빈 칸에 지뢰 매설. 상대가 밟으면 그 돌은 터지고 턴 끝',k:'target'},
 shield:{n:'방패',j:'盾',t:0,d:'상대 3턴 동안 내 돌은 지워지지도 뺏기지도 않는다',k:'instant'},
 bomb:{n:'폭탄',j:'爆',t:1,d:'3×3 범위를 통째로 날린다. 내 돌도 예외 없음',k:'target'},
 double:{n:'연타',j:'連',t:1,d:'이번 턴에 돌을 2개 둔다',k:'active'},
 convert:{n:'세뇌',j:'洗',t:1,d:'상대 돌 1개를 내 돌로 바꾼다',k:'target'},
 fog:{n:'안개',j:'霧',t:1,d:'상대의 다음 2턴 동안 내 돌이 안 보인다',k:'instant'},
 undo:{n:'시간역행',j:'逆',t:1,d:'상대가 마지막에 둔 돌을 없던 일로',k:'active'},
 gravity:{n:'중력 붕괴',j:'重',t:2,d:'판 위의 모든 것이 아래로 쏟아진다',k:'instant'},
 swap:{n:'운명 교환',j:'換',t:2,d:'판 위 모든 흑돌과 백돌이 뒤바뀐다',k:'instant'},
 four:{n:'사목',j:'四',t:2,d:'이제부터 4개만 이어도 이긴다',k:'instant'},
 meteor:{n:'운석우',j:'隕',t:2,d:'무작위 3곳에 3×3 운석이 떨어진다',k:'instant'},
 zen:{n:'명상',j:'無',t:0,d:'아무 일도 일어나지 않는다. 마음이 편안해진다',k:'instant'},
 pigeon:{n:'비둘기',j:'鳩',t:0,d:'비둘기 떼가 지나가며 판 위 3곳에 똥(벽)을 싸고 간다',k:'instant'},
 gift:{n:'정 나눔',j:'情',t:0,d:'상대에게 돌 1개를 선물하고, 증강을 하나 더 고른다',k:'instant'},
 kibitz:{n:'훈수꾼',j:'訓',t:0,d:'옆에서 훈수 두던 아저씨가 상대 손을 툭 쳐서, 상대의 다음 2수가 한 칸 빗나간다',k:'instant'},
 ice:{n:'빙판',j:'氷',t:1,d:'상대의 다음 2수가 무작위 방향으로 쭉 미끄러진다',k:'instant'},
 cat:{n:'고양이',j:'猫',t:1,d:'고양이가 3턴 동안 매 턴 아무 돌이나 하나씩 툭 쳐서 떨어뜨린다. 누구 돌이든',k:'instant'},
 rps:{n:'가위바위보',j:'拳',t:1,d:'이기면 상대 돌 3개 증발, 지면 내 돌 3개 증발, 비기면 둘 다 2개씩',k:'instant'},
 thief:{n:'돌 도둑',j:'盜',t:1,d:'상대가 아껴둔 증강 1장을 훔친다',k:'instant'},
 clock:{n:'초읽기',j:'秒',t:1,d:'상대는 다음 턴에 3초 안에 둬야 한다. 못 두면 아무 데나 놓인다',k:'instant'},
 clone:{n:'분신술',j:'分',t:1,d:'내가 마지막에 둔 돌 옆에 분신 2개가 생긴다',k:'instant'},
 lotto:{n:'복권',j:'福',t:1,d:'당첨되면 내 돌 4개가 쏟아지고, 꽝이면 내 돌 2개가 증발',k:'instant'},

function dests(k,fx,fy){const q=op(S.turn),out=[],cap=(x,y)=>S.b[y][x]===q&&!shielded(q);
